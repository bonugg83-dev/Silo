<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Silo</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- 작업 -->
  <section id="work" class="view">
    <div class="hd">
      <span class="brand" id="brand" role="img" aria-label="Silo">S<span class="g">ı<span class="brand-dot" aria-hidden="true">i</span></span>lo</span>
      <span class="hd-r">
        <button type="button" id="btnOpenSettings" class="icon" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
      </span>
    </div>

    <!-- 1층: 교정하기 · 자동모드 -->
    <div class="r sb">
      <div class="r">
        <button type="button" id="btnAnalyze" class="pill fix"><span class="halo"></span><span class="ring"></span>교정하기</button>
        <span id="wait" class="wait" hidden></span>
      </div>
      <button type="button" id="btnAuto" class="switch" role="switch" aria-checked="true">자동모드<span class="track"></span></button>
    </div>

    <div id="tocAlert" class="alert hidden">목차를 읽지 못했어요. <button type="button" id="btnTocRetry" class="link">다시 읽기</button></div>
    <div id="error" class="alert error hidden"></div>
    <div id="progress" class="note hidden"></div>

    <div id="workMain" class="stack">
      <!-- 결과 칸 -->
      <div id="result" class="box scroll" data-state="empty">
        <div id="placeholder" class="ph">교정하기를 눌러 주세요</div>
        <div id="stepLine" class="stepline"></div>
        <div id="outputView" class="output-view"></div>
        <textarea id="output" class="hidden" spellcheck="false" aria-label="교정 결과 고치기"></textarea>
      </div>
      <div id="liveWarn" class="note warn"></div>

      <!-- 2층: 복붙하기 · 수정하기 -->
      <div class="r">
        <button type="button" id="btnApply" class="pill copy">복붙하기<span class="over" aria-hidden="true">복붙성공</span></button>
        <button type="button" id="btnToggleEdit" class="pill">수정하기</button>
        <button type="button" id="btnReviewed" class="pill hidden">확인함</button>
      </div>

      <!-- 3층: 보기 칩 · 쪽 번호 -->
      <div class="r sb">
        <div class="chips">
          <button type="button" class="chip" data-panel="tocPanel" id="tgToc" aria-pressed="false">목차</button>
          <button type="button" class="chip" data-panel="diffPanel" id="tgOcr" aria-pressed="false" disabled>OCR 수정</button>
        </div>
        <div class="r gap6">
          <span id="pageDot" class="dot hidden" title=""></span>
          <label class="pg"><input type="text" id="pageNum" inputmode="numeric" aria-label="쪽 번호"><span>Page</span></label>
          <input type="checkbox" id="nonePage" class="hidden">
        </div>
      </div>
      <div id="dw" class="dw">
        <div id="tocPanel" class="drawer hidden">
          <div id="tocStatus" class="note"></div>
          <textarea id="tocText" class="scroll" spellcheck="false" placeholder="아직 없어요. 첫 쪽을 교정할 때 만들어져요."></textarea>
          <div id="tocNotes" class="note pre"></div>
          <div class="r"><button type="button" id="btnSaveToc" class="pill sm">목차 저장</button><button type="button" id="btnRebuildToc" class="pill sm">다시 읽기</button></div>
        </div>
        <div id="diffPanel" class="drawer hidden">
          <div id="diff" class="diff"></div>
          <div id="notes" class="note pre"></div>
          <ul id="changes" class="note"></ul>
        </div>
      </div>

      <!-- 교정이 끝나면 나타나는 긴 검수 버튼 -->
      <button type="button" id="btnReview" class="review-bar hidden">검수 <span id="reviewBadge" class="badge hidden"></span></button>
    </div>
  </section>

  <!-- 설정: 오른쪽에서 밀려 들어옴 -->
  <section id="settings" class="view set scroll" aria-hidden="true" inert>
    <div class="hd">
      <span>설정</span>
      <button type="button" id="btnCloseSettings" class="icon" aria-label="작업으로 돌아가기"><svg viewBox="0 0 24 24"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></svg></button>
    </div>
    <span class="lbl">API 키</span>
    <div id="keyList" class="keys" role="radiogroup" aria-label="API 키"></div>
    <div class="r"><button type="button" id="btnAddKey" class="pill">키 추가</button></div>
    <div id="addKeyBox" class="adv"><div class="adv-in">
      <input type="text" id="newKeyName" placeholder="이름 (예: A키)">
      <input type="password" id="newKeyValue" placeholder="sk-ant-..." autocomplete="off">
      <div class="r"><button type="button" id="btnSaveKey" class="pill">저장</button></div>
    </div></div>
    <div id="settingsMsg" class="note"></div>

    <span class="lbl">AI 모델</span>
    <select id="model"></select>
    <div id="todayCost" class="note"></div>

    <div class="r sb">
      <button type="button" id="btnPractice2" class="pill">연습 페이지</button>
      <button type="button" id="btnAdvanced" class="tri" aria-label="상세 설정" aria-expanded="false"><svg viewBox="0 0 12 12"><path d="M2 4h8l-4 5z"/></svg></button>
    </div>
    <div id="advancedBox" class="adv"><div class="adv-in">
      <label class="opt">2차 검증<input type="checkbox" id="verify" class="tg"></label>
      <label class="opt">2차 검증 때 원본 전체 다시 보기<input type="checkbox" id="verifyFull" class="tg"></label>
      <label class="opt">확대 이미지 함께 보내기<input type="checkbox" id="zoom" class="tg"></label>
      <label class="opt">시각자료 자동으로 잘라 넣기<input type="checkbox" id="autoVisuals" class="tg"></label>
      <label class="opt">줄표(―) 앞뒤
        <select id="dashSpacing" class="sm">
          <option value="attach">붙여 쓰기</option>
          <option value="keep">원본대로</option>
        </select>
      </label>
      <label class="opt">쪽 넘김 간격<input type="checkbox" id="pacing" class="tg"></label>
      <div class="opt sub">
        <span class="note">쪽마다 기다리는 시간</span>
        <span class="r gap6"><input type="number" id="paceMinSec" class="num" min="0" max="600" step="5" aria-label="최소 초"> ~ <input type="number" id="paceMaxSec" class="num" min="0" max="600" step="5" aria-label="최대 초">초</span>
      </div>
      <div class="r"><button type="button" id="btnSaveAdvanced" class="pill">저장</button><span id="advancedMsg" class="note"></span></div>
    </div></div>
  </section>

  <!-- 검수: 아래에서 올라옴 -->
  <section id="sheet" class="sheet scroll" aria-hidden="true" aria-label="검수" inert>
    <div class="r sb sheet-hd">
      <button type="button" id="btnSheetBack" class="pill">돌아가기</button>
      <div class="sort-wrap">
        <button type="button" id="btnSort" class="pill sm" aria-expanded="false" aria-controls="sortMenu">정렬 <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4h8l-4 5z"/></svg></button>
        <div id="sortMenu" class="sort-menu">
          <div class="seg" role="group" aria-label="정렬 순서">
            <button type="button" data-order="asc" aria-pressed="true">오름차순</button>
            <button type="button" data-order="desc" aria-pressed="false">내림차순</button>
          </div>
          <button type="button" id="btnShowAll" class="switch" role="switch" aria-checked="false">확인한 쪽도 보기<span class="track"></span></button>
        </div>
      </div>
    </div>
    <div id="reviewLinksBox" class="card hidden">
      <h3>다른 쪽에 걸친 각주</h3>
      <div id="reviewLinks"></div>
      <div class="r"><button type="button" id="btnApplyAllLinks" class="pill sm">모두 반영</button></div>
    </div>
    <div id="reviewPages" class="rv-list"></div>
  </section>

  <!-- 시각자료 영역 고치기 -->
  <div id="cropModal" class="modal hidden">
    <div class="modal-body">
      <div class="r sb"><h3>영역 고치기</h3><button type="button" id="btnCropClose" class="pill sm">닫기</button></div>
      <div id="cropStage" class="crop-stage">
        <img id="cropPage" alt="원본 쪽">
        <div id="cropBox" class="crop-box">
          <span class="h nw"></span><span class="h ne"></span><span class="h sw"></span><span class="h se"></span>
        </div>
      </div>
      <div class="r"><button type="button" id="btnCropApply" class="pill white">이 영역으로 자르기</button></div>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
