<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>마이픽 교정 도우미</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <nav>
      <button class="tab active" data-tab="work">작업</button>
      <button class="tab" data-tab="settings">설정</button>
    </nav>
  </header>

  <main>
    <!-- 작업 -->
    <section id="tab-work" class="panel active">
      <div class="row between">
        <div class="row tight">
          <button id="btnAnalyze" class="primary">교정하기</button>
          <button id="btnAuto">자동 모드</button>
          <button id="btnApply">편집기에 넣기</button>
        </div>
        <button id="btnReview" class="hidden">검수 <span id="reviewBadge" class="badge"></span></button>
      </div>
      <div id="tocAlert" class="alert hidden">목차를 읽지 못했어요. <button id="btnTocRetry" class="small-btn">다시 읽기</button></div>
      <div id="progress" class="progress hidden"></div>
      <div id="error" class="alert error hidden"></div>

      <!-- 검수 목록 (검수 버튼으로 펼침) -->
      <div id="reviewBox" class="hidden">
        <div id="reviewSummary" class="small"></div>
        <div id="reviewLinksBox" class="card hidden">
          <h2>다른 쪽에 걸친 각주</h2>
          <div id="reviewLinks"></div>
          <div class="row"><button id="btnApplyAllLinks" class="primary small-btn">모두 반영</button></div>
        </div>
        <div id="reviewPages"></div>
        <div class="row"><button id="btnReviewShowAll" class="small-btn">확인한 쪽도 보기</button></div>
      </div>

      <div id="result" class="hidden">
        <div class="row between pageline">
          <label class="inline small">쪽 <input type="text" id="pageNum" size="4" inputmode="numeric"></label>
          <span id="pageDot" class="dot hidden" title=""></span>
          <input type="checkbox" id="nonePage" class="hidden">
          <span class="spacer"></span>
          <button id="btnToggleEdit" class="small-btn">직접 고치기</button>
        </div>
        <div id="outputView" class="output-view"></div>
        <textarea id="output" class="hidden" spellcheck="false"></textarea>
        <div id="liveWarn" class="small"></div>
        <div class="row"><button id="btnReviewed" class="hidden">확인함</button></div>
      </div>

      <div class="row tight toggles">
        <button class="toggle" data-panel="diffPanel" id="tgOcr" disabled>OCR</button>
        <button class="toggle" data-panel="changesPanel" id="tgChanges" disabled>수정</button>
        <button class="toggle" data-panel="tocPanel" id="tgToc">목차</button>
      </div>
      <div id="diffPanel" class="card hidden"><div id="diff" class="diff"></div></div>
      <div id="changesPanel" class="card hidden"><div id="notes" class="small pre"></div><ul id="changes" class="small"></ul></div>
      <div id="tocPanel" class="card hidden">
        <div id="tocStatus" class="small"></div>
        <textarea id="tocText" spellcheck="false" placeholder="아직 없어요. 첫 쪽을 교정할 때 만들어져요."></textarea>
        <div id="tocNotes" class="small muted pre"></div>
        <div class="row"><button id="btnSaveToc" class="small-btn">목차 저장</button><button id="btnRebuildToc" class="small-btn">다시 읽기</button></div>
      </div>
    </section>

    <!-- 설정 -->
    <section id="tab-settings" class="panel">
      <div class="card">
        <h2>Claude API 키</h2>
        <div id="keyList"></div>
        <div class="sub">
          <input type="text" id="newKeyName" placeholder="이름 (예: A사용자 키)">
          <input type="password" id="newKeyValue" placeholder="sk-ant-..." autocomplete="off">
          <div class="row"><button id="btnAddKey" class="primary">키 추가</button></div>
        </div>
      </div>
      <div class="card">
        <h2>AI 모델</h2>
        <select id="model"></select>
        <p class="small muted" id="todayCost"></p>
      </div>
      <div class="row">
        <button id="btnPractice2">연습 페이지 열기</button>
        <button id="btnAdvanced">상세 설정</button>
      </div>
      <div id="settingsMsg" class="small muted"></div>

      <div id="advancedBox" class="card hidden">
        <h2>상세 설정</h2>
        <label class="inline"><input type="checkbox" id="verify"> 2차 검증</label>
        <label>줄표(―) 앞뒤
          <select id="dashSpacing">
            <option value="attach">붙여 쓰기</option>
            <option value="keep">원본대로</option>
          </select>
        </label>
        <label class="inline"><input type="checkbox" id="autoVisuals"> 시각자료 자동으로 잘라 넣기</label>
        <label class="inline"><input type="checkbox" id="pacing"> 자동 모드 쪽 넘김 간격</label>
        <div class="row">
          <label class="inline">최소 <input type="number" id="paceMinSec" min="0" max="600" step="5" style="width:70px">초</label>
          <label class="inline">최대 <input type="number" id="paceMaxSec" min="0" max="600" step="5" style="width:70px">초</label>
        </div>
        <div class="row">
          <button id="btnSaveAdvanced" class="primary">저장</button>
          <button id="btnClearBook">이 책 작업 기록 지우기</button>
        </div>
        <div id="advancedMsg" class="small muted"></div>
      </div>
    </section>
  </main>

  <!-- 시각자료 영역 고치기 -->
  <div id="cropModal" class="modal hidden">
    <div class="modal-body">
      <div class="row between"><h2>영역 고치기</h2><button id="btnCropClose" class="small-btn">닫기</button></div>
      <div id="cropStage" class="crop-stage">
        <img id="cropPage" alt="원본 쪽">
        <div id="cropBox" class="crop-box">
          <span class="h nw"></span><span class="h ne"></span><span class="h sw"></span><span class="h se"></span>
        </div>
      </div>
      <div class="row"><button id="btnCropApply" class="primary">이 영역으로 자르기</button></div>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
