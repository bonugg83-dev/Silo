name: 앱 빌드 (윈도·태블릿)

# 기본 브랜치에 머지되면: 윈도 설치 파일을 만들어 GitHub Releases에 올리고(설치한 앱이 여기서 새 버전을 받아 감),
#   같은 릴리스에 태블릿 APK(Silo-<버전>.apk)도 붙인다. 버전은 둘이 같이 desktop/package.json 의 version.
#   같은 버전이 이미 올라가 있으면 다시 올리지 않으므로(설치 파일만 만듦), 새로 배포하려면 desktop/package.json 의 version 을 올린다.
# 그 밖의 브랜치(PR 등): 설치 파일만 만들어 Actions 결과물로 남긴다 (배포하지 않음).

on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'app/**', 'android/**', '.github/workflows/desktop.yml']

permissions:
  contents: write # Releases에 올리기

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop

      # 기본 브랜치이고 이 버전이 아직 Releases에 없을 때만 배포
      - name: 배포할지 정하기
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          publish=false
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            if gh api "repos/${{ github.repository }}/releases/tags/v$v" >/dev/null 2>&1; then
              echo "v$v 은 이미 배포됨: 설치 파일만 만듦 (새로 배포하려면 desktop/package.json 버전을 올리세요)"
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 설치 파일 만들고 Releases에 올리기
        if: steps.plan.outputs.publish == 'true'
        run: npm run release:win
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 설치 파일만 만들기
        if: steps.plan.outputs.publish != 'true'
        run: npm run dist:win
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: Silo-Setup
          path: |
            desktop/dist/Silo-Setup-*.exe
            desktop/dist/latest.yml

  # 태블릿(안드로이드) APK. 윈도 쪽이 이번에 새 릴리스를 만들었으면 거기에 붙인다
  android:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle # 받은 빌드 부품을 저장해 두고 다음 빌드에 다시 씀 (Maven 서버가 가끔 429로 막아서)
      # 서명 키: 저장소 Settings → Secrets 의 SILO_KEYSTORE_B64 (키 파일을 base64로), SILO_KEYSTORE_PASSWORD, SILO_KEY_ALIAS, SILO_KEY_PASSWORD
      - name: 서명 키 준비
        id: key
        shell: bash
        env:
          KS: ${{ secrets.SILO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/silo.jks"
            echo "SILO_KEYSTORE_FILE=$RUNNER_TEMP/silo.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::서명 키(SILO_KEYSTORE_B64)가 없어 시험용 키로 만듦. 이 APK는 Releases에 올리지 않음"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: APK 만들기
        working-directory: android
        env:
          SILO_KEYSTORE_PASSWORD: ${{ secrets.SILO_KEYSTORE_PASSWORD }}
          SILO_KEY_ALIAS: ${{ secrets.SILO_KEY_ALIAS }}
          SILO_KEY_PASSWORD: ${{ secrets.SILO_KEY_PASSWORD }}
        run: |
          # 부품을 받는 서버가 잠깐 막히면(429 등) 조금 기다렸다가 다시 (최대 3번)
          for i in 1 2 3; do
            ./gradlew assembleRelease --no-daemon && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "::warning::빌드 실패, $((i * 30))초 뒤 다시 시도 ($i/3)"
            sleep $((i * 30))
          done
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Silo-${{ needs.windows.outputs.version }}.apk"
      - name: 같은 릴리스에 APK 붙이기
        if: needs.windows.outputs.publish == 'true' && steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.windows.outputs.version }}" out/*.apk --clobber --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Silo-Android
          path: android/out/*.apk
