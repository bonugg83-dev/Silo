name: 설치 웹사이트 (GitHub Pages)

# site/ 폴더를 GitHub Pages로 올린다. 페이지가 열릴 때 최신 릴리스를 직접 읽어 오므로
# 새 버전을 낼 때마다 사이트를 다시 올릴 필요는 없다. (site/ 를 고쳤을 때만 다시 배포)
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로.

on:
  workflow_dispatch:
  push:
    paths: ['site/**', '.github/workflows/site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
